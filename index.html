<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tabelas HTML estilizadas com CSS puro — exercício de HTML e CSS Básico">
  <title>Tabelas Estilizadas — HTML & CSS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">HTML & CSS Básico</p>
      <h1>Tabelas Estilizadas</h1>
      <p class="subtitle">Layout limpo com cabeçalhos coloridos e tipografia legível — sem framework.</p>
    </header>

    <section class="card" aria-labelledby="moda-title">
      <h2 id="moda-title">Moda</h2>
      <div class="table-wrap">
        <table class="data-table">
          <thead class="header-moda">
            <tr>
              <th scope="col">Produto</th>
              <th scope="col">Tamanho</th>
              <th scope="col">Valor</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Camiseta</td>
              <td>M</td>
              <td>R$&nbsp;49,00</td>
            </tr>
            <tr>
              <td>Tênis</td>
              <td>42</td>
              <td>R$&nbsp;299,00</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card" aria-labelledby="casa-title">
      <h2 id="casa-title">Casa</h2>
      <div class="table-wrap">
        <table class="data-table">
          <thead class="header-casa">
            <tr>
              <th scope="col">Produto</th>
              <th scope="col">Valor</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Sofá</td>
              <td>R$&nbsp;1.200,00</td>
            </tr>
            <tr>
              <td>Televisão</td>
              <td>R$&nbsp;5.000,00</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
